<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap"><div class="top"><div class="logo">PA<span>BET</span></div><button class="lo" id="out">دەرچوون</button></div>
<div class="card" id="alog"><h2>چوونەژوورەوەی بەڕێوەبەر</h2><div class="f"><label>ناوی بەکارهێنەر</label><input id="au" dir="ltr" autocomplete="username"></div><div class="f"><label>وشەی نهێنی</label><input id="ap" type="password" dir="ltr" autocomplete="current-password"></div><button class="go" id="ag" style="width:100%">چوونەژوورەوە</button><div class="msg" id="am"></div></div>
<div class="card hide" id="apan"><h2>یاریزانان</h2><div class="note" id="cnt"></div><div class="f"><input id="srch" placeholder="گەڕان بە ناو، ناوی بەکارهێنەر یان مۆبایل"></div><div id="plist"></div></div></div>
<script>
const $=s=>document.querySelector(s),fmt=n=>Number(n||0).toLocaleString('en');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(r,d)=>{try{const x=await fetch('/api/app',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({r,...d})});const j=await x.json();return x.ok?j:{e:j.e||'هەڵە',s:x.status};}catch(e){return{e:'پەیوەندی بە سێرڤەر نییە.'};}};
let list=[],q='',amts={},timer=null;
const draw=()=>{const L=list.filter(p=>!q||((p.name||'')+' '+(p.username||'')+' '+(p.phone||'')).toLowerCase().includes(q));
 $('#cnt').textContent='کۆی یاریزانان: '+list.length;
 $('#plist').innerHTML=L.length?L.map(p=>`<div class="row" data-k="${esc(p.key)}"><div class="nm">${esc(p.name)} (${esc(p.username)})<span>${fmt(p.credit)}</span></div><small dir="ltr" style="text-align:right">${esc(p.phone)} - ${p.created?new Date(p.created).toLocaleDateString('en-GB'):''}</small>${p.ban>Date.now()?'<small style="color:#ff8a80">قەدەغەیە تا '+new Date(p.ban).toLocaleString('en-GB')+'</small>':''}<input class="am" inputmode="numeric" placeholder="بڕ" value="${esc(amts[p.key]||'')}"><button data-a="add">+ زیادکردن</button><button data-a="sub">- کەمکردن</button><button data-a="set">دانان</button><button class="dl" data-a="del">سڕینەوە</button><div style="flex:1 1 100%;display:flex;gap:6px;align-items:center;flex-wrap:wrap"><input class="bn" inputmode="numeric" placeholder="ماوە" style="width:80px"><select class="bu"><option value="1">خولەک</option><option value="60">کاتژمێر</option></select><button data-a="ban">باند</button>${p.ban>Date.now()?'<button data-a="unban">لابردنی باند</button>':''}</div></div>`).join(''):'یاریزانێک نەدۆزرایەوە.';};
const load=async(f)=>{const x=await api('admin_list');
 if(x.e){if(x.s===401){$('#alog').classList.remove('hide');$('#apan').classList.add('hide');clearInterval(timer);}return;}
 $('#alog').classList.add('hide');$('#apan').classList.remove('hide');
 const t=document.activeElement&&document.activeElement.tagName;if(f||(t!=='INPUT'&&t!=='SELECT')||document.activeElement.id==='srch'){list=x.users;draw();}else list=x.users;
 if(!timer)timer=setInterval(load,15000);};
$('#ag').onclick=async()=>{const m=$('#am'),x=await api('admin_login',{u:$('#au').value,p:$('#ap').value});if(x.e){m.className='msg lose';m.textContent=x.e;return;}$('#ap').value='';load();};
$('#out').onclick=async()=>{await api('admin_logout');location.reload();};
$('#srch').oninput=e=>{q=e.target.value.trim().toLowerCase();draw();};
$('#plist').addEventListener('input',e=>{if(e.target.classList.contains('am'))amts[e.target.closest('.row').dataset.k]=e.target.value;});
$('#plist').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 const row=b.closest('.row'),k=row.dataset.k,inp=row.querySelector('.am'),a=b.dataset.a;
 if(a==='del'){if(!confirm('ئەم ئەکاونتە بە تەواوی دەسڕێتەوە. دڵنیایت؟'))return;b.disabled=true;await api('admin_delete',{key:k});await load(true);return;}
 if(a==='ban'||a==='unban'){const n=Math.floor(Number(row.querySelector('.bn').value))*Number(row.querySelector('.bu').value);
  if(a==='ban'&&!(n>0)){alert('ماوەیەک بنووسە');return;}
  b.disabled=true;await api('admin_ban',{key:k,minutes:a==='ban'?n:0});await load(true);return;}
