<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PA Bet</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap" id="app"><p style="text-align:center;margin-top:40px">...</p></div>
<script>
(async()=>{
const A=document.getElementById('app'),$=s=>A.querySelector(s),$$=s=>[...A.querySelectorAll(s)];
const fmt=n=>Number(n||0).toLocaleString('en'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const api=async(r,d)=>{try{const x=await fetch('/api/app',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({r,...d})});const j=await x.json();if(j.ban&&window.onBan)window.onBan(j.ban);return x.ok?j:{e:j.e||'هەڵە',ban:j.ban};}catch(e){return{e:'پەیوەندی بە سێرڤەر نییە.'};}};
const reds=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const col=n=>n===0?'#0d7a3e':reds.includes(n)?'#c8312a':'#14181c';
const ORD=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26],st=360/37;
const pt=(r,a)=>{const t=(a-90)*Math.PI/180;return[(150+r*Math.cos(t)).toFixed(1),(150+r*Math.sin(t)).toFixed(1)];};
let wp='';ORD.forEach((n,i)=>{const a0=i*st-st/2,a1=a0+st,p0=pt(140,a0),p1=pt(140,a1),p2=pt(98,a1),p3=pt(98,a0);
 wp+=`<path d="M${p0}A140 140 0 0 1 ${p1}L${p2}A98 98 0 0 0 ${p3}Z" fill="${col(n)}" stroke="#d4af37" stroke-width=".7"/><text x="150" y="31" transform="rotate(${i*st} 150 150)" fill="#fff" font-size="9.5" font-weight="700" text-anchor="middle">${n}</text>`;});
const wheel=`<svg class="wheel" viewBox="0 0 300 300"><circle cx="150" cy="150" r="148" fill="#3a2410" stroke="#d4af37" stroke-width="3"/><g id="wh" style="transform-origin:150px 150px">${wp}<circle cx="150" cy="150" r="97" fill="#1d2226" stroke="#d4af37" stroke-width="2"/><circle cx="150" cy="150" r="56" fill="#0d1216" stroke="#d4af37" stroke-width="2"/><path d="M150 100V200M100 150H200" stroke="#d4af37" stroke-width="4"/><circle cx="150" cy="150" r="10" fill="#d4af37"/></g><g id="bl" style="transform-origin:150px 150px"><circle cx="150" cy="17" r="6" fill="#fff" stroke="#999"/></g><path d="M144 0h12l-6 12z" fill="#f2b705"/></svg>`;
let cells='<button class="z" data-k="n0">0</button>';
for(let r=0;r<3;r++)for(let c=0;c<12;c++){const n=c*3+3-r;cells+=`<button class="${reds.includes(n)?'r':'k'}" data-k="n${n}">${n}</button>`;}
const outs=[['d1','1 - 12',''],['d2','13 - 24',''],['d3','25 - 36',''],['h1','1 - 18',''],['ev','جووت',''],['rd','سوور','r'],['bk','ڕەش','k'],['od','تاک',''],['h2','19 - 36','']];
const betBar='<div class="bar"><label>بڕی بەست</label><input class="amt" inputmode="numeric" value="100"><button class="q" data-v="100">100</button><button class="q" data-v="500">500</button><button class="q" data-v="1000">1000</button></div>';
const top=r=>`<div class="top"><div class="logo">PA<span>BET</span></div>${r||''}</div>`;
A.innerHTML=`
<section id="vauth" class="hide">${top()}<div class="card"><div class="bar"><button class="tb on" id="tl">چوونەژوورەوە</button><button class="tb" id="tr">ئەکاونتی نوێ</button></div>
<div id="fr" class="hide"><div class="f"><label>ناوی تەواو</label><input id="rn" autocomplete="name"></div><div class="f"><label>ژمارەی مۆبایل</label><input id="rp" dir="ltr" inputmode="tel" autocomplete="tel"></div></div>
<div class="f"><label>ناوی بەکارهێنەر (پیتی ئینگلیزی و ژمارە)</label><input id="ru" dir="ltr" autocomplete="username"></div>
<div class="f"><label>وشەی نهێنی (6 پیت یان زیاتر)</label><input id="rw" type="password" dir="ltr" autocomplete="current-password"></div>
<button class="go" id="ag" style="width:100%">چوونەژوورەوە</button><div class="msg" id="am"></div><div class="note" id="an"></div></div></section>
<section id="vmain" class="hide">${top('<div class="acct"><span id="who"></span> <button class="lo" id="lo">دەرچوون</button><b id="bal">0</b></div>')}
<nav><button class="on" data-t="lob">سەرەکی</button><button data-t="rou">ڕۆڵێت</button><button data-t="bj">بلاک جەک</button><button data-t="slot">سلۆت</button></nav>
